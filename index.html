<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon-96" rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link id="favicon-svg" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="favicon-ico" rel="shortcut icon" href="/favicon.ico" />
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="HMGSLab" />
    <link id="site-manifest" rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMGSlab — HMGS hazırlık platformu | Canlı deneme ve performans analizi</title>
    <meta
      name="description"
      content="HMGSlab ile HMGS'ye planlı canlı denemeler, performans analizi ve detaylı sonuç incelemesi. Ücretsiz kayıt olun, hazırlığınızı veriye dayalı yönetin."
    />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HMGSlab — HMGS hazırlık platformu" />
    <meta
      property="og:description"
      content="Planlı canlı denemeler, performans takibi ve sınav sonrası detaylı analiz — HMGS hazırlığı için HMGSlab."
    />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HMGSlab — HMGS hazırlık platformu" />
    <meta
      name="twitter:description"
      content="Planlı canlı denemeler, performans takibi ve detaylı sonuç incelemesi."
    />
    <script>
      ;(function () {
        try {
          var isDark = localStorage.getItem('hmgSlab-theme') === 'dark'
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
            var favicon96 = document.getElementById('favicon-96')
            var faviconSvg = document.getElementById('favicon-svg')
            var faviconIco = document.getElementById('favicon-ico')
            var appleTouch = document.getElementById('apple-touch-icon')
            var manifest = document.getElementById('site-manifest')
            if (favicon96) favicon96.href = '/favicon-dark-96x96.png'
            if (faviconSvg) faviconSvg.href = '/favicon-dark.svg'
            if (faviconIco) faviconIco.href = '/favicon-dark.ico'
            if (appleTouch) appleTouch.href = '/apple-touch-icon-dark.png'
            if (manifest) manifest.href = '/site-dark.webmanifest'
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
